[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crowsnest"
version = "0.0.14"
description = "One session that watches your other Claude Code sessions: who is busy, who is waiting on you, what each one just said, and how to ask one directly"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["claude-code", "agents", "sessions", "monitor", "transcripts"]
authors = [{ name = "Thor Whalen" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
# `openloops` owns the reading of a transcript's *content* -- which user line is a human
# speaking, what the assistant's last words were -- and crowsnest adds the live half it
# deliberately leaves out: which sessions are running, and what each is doing this
# minute. `cw` builds the CLI from the same functions the library exposes.
dependencies = ["openloops>=0.1.9", "cw>=0.1.1,<0.2"]

[project.scripts]
crowsnest = "crowsnest.__main__:main"

[project.urls]
Homepage = "https://github.com/thorwhalen/crowsnest"
Repository = "https://github.com/thorwhalen/crowsnest"
Issues = "https://github.com/thorwhalen/crowsnest/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["crowsnest"]

# `.claude/skills/<name>` is a directory symlink into `crowsnest/data/skills/`; hatchling's
# walker dedupes directories by inode while following links, and would prune the real
# skill directories after reaching them through the bridge first. `only-include` never
# enters `.claude` at all. (Measured on openloops, 2026-08-27.)
[tool.hatch.build.targets.sdist]
only-include = ["crowsnest", "tests", ".github", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests", "crowsnest"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.wads.ci]
project_name = "crowsnest"

[tool.wads.ci.testing]
python_versions = ["3.10", "3.12"]
